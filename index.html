<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para Peque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #05060d;
    --night-2: #0b0e1c;
    --gold: #d9b25c;
    --gold-bright: #f2d189;
    --wine: #7a1f34;
    --ivory: #f3ede1;
    --muted: #8891a8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--night);
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  #sky {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(122,31,52,0.25), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(217,178,92,0.10), transparent 50%),
      linear-gradient(180deg, #05060d 0%, #0b0e1c 60%, #0e1226 100%);
    z-index: 0;
  }

  .star {
    position: absolute;
    background: var(--ivory);
    border-radius: 50%;
    opacity: 0;
    animation: twinkle 4s ease-in-out infinite, appear 1.8s ease forwards;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.9; }
  }
  @keyframes appear {
    to { opacity: var(--max-op, 0.7); }
  }

  .moon {
    position: absolute;
    top: 8%;
    right: 10%;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--gold-bright), var(--gold) 60%, #a5813a 100%);
    box-shadow: 0 0 40px 6px rgba(217,178,92,0.35);
    opacity: 0;
    animation: appear 2s ease 0.3s forwards;
    z-index: 1;
  }

  main {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1rem, 2vw, 1.15rem);
    color: var(--gold);
    letter-spacing: 0.02em;
    margin-bottom: 14px;
    opacity: 0;
    animation: rise 1s ease 0.5s forwards;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(2.2rem, 6vw, 4rem);
    line-height: 1.1;
    color: var(--ivory);
    margin: 0 0 18px;
    max-width: 14ch;
    background: linear-gradient(100deg, var(--ivory) 30%, var(--gold-bright) 55%, var(--ivory) 75%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    animation: rise 1s ease 0.7s forwards;
  }

  .sub {
    color: var(--muted);
    font-size: 0.95rem;
    max-width: 40ch;
    margin: 0 0 42px;
    opacity: 0;
    animation: rise 1s ease 0.9s forwards;
    min-height: 1.4em;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .choices {
    position: relative;
    display: flex;
    gap: 22px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    opacity: 0;
    animation: rise 1s ease 1.1s forwards;
    width: min(90vw, 380px);
    height: 200px;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    border: none;
    cursor: pointer;
    border-radius: 999px;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), box-shadow 0.35s ease, background 0.3s ease;
  }

  #yes {
    padding: 16px 30px;
    font-size: 1.05rem;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: #241605;
    box-shadow: 0 6px 24px rgba(217,178,92,0.35);
  }
  #yes:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 30px rgba(217,178,92,0.5); }

  #no {
    position: relative;
    padding: 14px 24px;
    font-size: 0.95rem;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: #241605;
    box-shadow: 0 6px 24px rgba(217,178,92,0.35);
    border: none;
  }
  #no.fleeing {
    position: absolute;
    z-index: 5;
  }

  .hint {
    margin-top: 26px;
    font-size: 0.82rem;
    color: var(--muted);
    opacity: 0;
    animation: rise 1s ease 1.3s forwards;
    min-height: 1.2em;
  }

  /* ---- celebration screen ---- */
  #celebration {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 24px;
    background: radial-gradient(ellipse at center, #100a05 0%, #05060d 70%);
  }
  #celebration.show { display: flex; }

  #celebration h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 7vw, 4.5rem);
    color: transparent;
    background: linear-gradient(100deg, var(--gold-bright), var(--ivory) 50%, var(--gold-bright));
    -webkit-background-clip: text;
    background-clip: text;
    margin: 0 0 12px;
    animation: rise 0.8s ease forwards;
  }
  #celebration p {
    color: var(--muted);
    font-size: 1rem;
    max-width: 36ch;
    animation: rise 0.8s ease 0.2s forwards;
    opacity: 0;
  }

  .spark {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold-bright);
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .star, h1, .eyebrow, .sub, .choices, .hint, #celebration h2, #celebration p {
      animation: none !important;
      opacity: 1 !important;
    }
  }
</style>
</head>
<body>

<div id="sky"></div>
<div class="moon"></div>

<main>
  <h1>¿Me quieres o puro pedo?</h1>
  <p class="sub" id="teaseText">Elige con cuidado.</p>

  <div class="choices">
    <button id="yes">Sí, casémonos 👉🏻👅</button>
    <button id="no">No, puro pedo alv, te odio 😠</button>
  </div>
</main>

<div id="celebration">
  <h2>Eh amor no era tan difícil, sabía que dirías que sí ahuevo</h2>
  <p>Te quiero mucho Peque y no es puro pedo &lt;444</p>
</div>

<script>
  // --- estrellas ---
  const sky = document.getElementById('sky');
  const starCount = window.innerWidth < 600 ? 60 : 110;
  for (let i = 0; i < starCount; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.setProperty('--max-op', (Math.random() * 0.6 + 0.3).toFixed(2));
    s.style.animationDelay = (Math.random() * 3) + 's, ' + (Math.random() * 1.5) + 's';
    sky.appendChild(s);
  }

  // --- botón esquivo ---
  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  const tease = document.getElementById('teaseText');

  const teases = [
    "COMO QUE NO'???",
    "Ok, te daré otra oportunidad mi amor",
    "Te has de querer morir ehhhh.",
  ];
  let dodgeCount = 0;

  const dodgeZone = document.querySelector('.choices');

  function getSafeRandomPosition() {
    const w = noBtn.offsetWidth;
    const h = noBtn.offsetHeight;
    const zoneW = dodgeZone.clientWidth;
    const zoneH = dodgeZone.clientHeight;
    const maxX = Math.max(0, zoneW - w);
    const maxY = Math.max(0, zoneH - h);

    // Área a evitar: el botón "Sí", con un margen extra de separación.
    const pad = 20;
    const avoidLeft = yesBtn.offsetLeft - pad;
    const avoidTop = yesBtn.offsetTop - pad;
    const avoidRight = yesBtn.offsetLeft + yesBtn.offsetWidth + pad;
    const avoidBottom = yesBtn.offsetTop + yesBtn.offsetHeight + pad;

    function overlapsYes(x, y) {
      return x < avoidRight && x + w > avoidLeft && y < avoidBottom && y + h > avoidTop;
    }

    let x, y;
    let attempts = 0;
    do {
      x = Math.random() * maxX;
      y = Math.random() * maxY;
      attempts++;
    } while (overlapsYes(x, y) && attempts < 20);

    return { x, y };
  }

  function fleeButton() {
    if (dodgeCount >= teases.length) return;

    if (!noBtn.classList.contains('fleeing')) {
      noBtn.style.left = noBtn.offsetLeft + 'px';
      noBtn.style.top = noBtn.offsetTop + 'px';
      noBtn.classList.add('fleeing');
    }

    const pos = getSafeRandomPosition();
    noBtn.style.left = pos.x + 'px';
    noBtn.style.top = pos.y + 'px';

    dodgeCount++;
    tease.textContent = teases[dodgeCount - 1];

    const scale = Math.min(1 + dodgeCount * 0.08, 1.3);
    yesBtn.style.transform = `scale(${scale})`;

    if (dodgeCount >= teases.length) {
      noBtn.style.transition = 'opacity 0.5s ease';
      noBtn.style.opacity = '0';
      setTimeout(() => { noBtn.style.display = 'none'; }, 500);
    }
  }

  // Solo reubica el botón dentro de la pantalla si cambia el tamaño de la
  // ventana (p. ej. al hacer zoom). Esto NO cuenta como un intento de
  // esquivar, así que no debe sumar al conteo ni disparar las frases.
  function keepButtonOnScreen() {
    if (!noBtn.classList.contains('fleeing')) return;
    if (dodgeCount >= teases.length) return;
    const pos = getSafeRandomPosition();
    noBtn.style.left = pos.x + 'px';
    noBtn.style.top = pos.y + 'px';
  }

  noBtn.addEventListener('mouseenter', fleeButton);
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); fleeButton(); }, { passive: false });
  noBtn.addEventListener('focus', fleeButton);
  noBtn.addEventListener('click', (e) => { e.preventDefault(); fleeButton(); });

  window.addEventListener('resize', keepButtonOnScreen);

  // --- celebración ---
  yesBtn.addEventListener('click', () => {
    document.getElementById('celebration').classList.add('show');
    burstSparks();
  });

  function burstSparks() {
    const container = document.getElementById('celebration');
    for (let i = 0; i < 40; i++) {
      const sp = document.createElement('div');
      sp.className = 'spark';
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 260 + 60;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      sp.style.left = '50%';
      sp.style.top = '42%';
      sp.style.opacity = '1';
      sp.style.transition = 'transform 1.1s cubic-bezier(.2,.8,.2,1), opacity 1.1s ease';
      container.appendChild(sp);
      requestAnimationFrame(() => {
        sp.style.transform = `translate(${dx}px, ${dy}px)`;
        sp.style.opacity = '0';
      });
      setTimeout(() => sp.remove(), 1200);
    }
  }
</script>

</body>
</html>
